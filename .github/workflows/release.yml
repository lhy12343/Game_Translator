name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 0.1.0)'
        required: true
        default: '0.1.0'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          # 加入 PATH
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: 提取版本号
        id: ver
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建 CustomTranslate 插件
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/bbepis/XUnity.AutoTranslator/releases/download/v5.6.1/XUnity.AutoTranslator-BepInEx-5.6.1.zip" -o xunity.zip
          echo "FBB7D1BBE2C7CC168DA6DCCBC500FB74786A85A548F52495C8A1592AC46407F5  xunity.zip" | sha256sum -c -
          7z x -y -bd -oxunity xunity.zip >/dev/null
          dotnet build src/xunity-batch -c Release \
            -p:XUnityCorePath="$(pwd)/xunity/BepInEx/plugins/XUnity.AutoTranslator/XUnity.AutoTranslator.Plugin.Core.dll"
          cp src/xunity-batch/bin/Release/net35/CustomTranslate.dll src/xunity-batch/CustomTranslate.dll

      - name: 编译 Release 版
        run: dotnet publish src/gui -c Release -r win-x64 --self-contained true -o publish/release

      - name: 编译 Debug 版
        run: dotnet publish src/gui -c Debug -r win-x64 --self-contained true -o publish/debug

      - name: 构建 Inno Setup 安装器
        shell: pwsh
        run: |
          # 补充中文语言包（choco 安装可能不含）
          $langDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          if (-not (Test-Path "$langDir\ChineseSimplified.isl")) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile "$langDir\ChineseSimplified.isl"
          }
          # 将 publish 输出复制到 Inno Setup 脚本期望的 release 目录
          if (Test-Path src/installer/release) { Remove-Item src/installer/release -Recurse -Force }
          Copy-Item -Path publish/release -Destination src/installer/release -Recurse -Force
          # 更新脚本中的版本号
          $iss = Get-Content src/installer/GameTranslator.iss -Raw
          $iss = $iss -replace '0\.1\.0', '${{ steps.ver.outputs.version }}'
          Set-Content src/installer/GameTranslator.iss $iss
          # 编译
          iscc src/installer/GameTranslator.iss

      - name: 整理发布产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          VER="${{ steps.ver.outputs.version }}"
          cp src/installer/GameTranslator-Setup.exe "dist/GameTranslator-Setup-${VER}.exe"
          (cd publish/release && 7z a -tzip -mx=9 "../../dist/GameTranslator-${VER}-win-x64.zip" .)

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', inputs.version) }}
          name: Game Translator ${{ steps.ver.outputs.version }}
          files: |
            dist/GameTranslator-Setup-${{ steps.ver.outputs.version }}.exe
            dist/GameTranslator-${{ steps.ver.outputs.version }}-win-x64.zip
          generate_release_notes: true
